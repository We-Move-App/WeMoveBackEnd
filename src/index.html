<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeMoveAll</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
      }

      .container {
        text-align: center;
        background: #fff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 500px;
      }

      h1 {
        color: #2c7be5;
        margin-bottom: 15px;
        font-size: 32px;
      }

      .status {
        color: #28a745;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      p {
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>WeMoveAll</h1>
      <div class="status">Server is Running Successfully</div>
      <p>Welcome to the WeMoveAll Backend.</p>
      <p>The application is up and running.</p>
    </div>
  </body>
</html>
